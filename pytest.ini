[pytest]
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*


markers =
    ui: Маркировка для UI тестов
    slow: Маркировка для медленных тестов
    smoke: Маркировка для смоук тестов
    regression: Маркировка для регресс тестов
    authorization: Маркировка для тестов авторизации
